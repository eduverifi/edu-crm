services:
  docs:
    image: educonnect_local_docs
    container_name: educonnect_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - path: ./.envs/.local/.django
        required: false
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./educonnect:/app/educonnect:z
    ports:
      - '9000:9000'
    command: /start-docs
